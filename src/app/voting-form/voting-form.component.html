<div class="vote-form" [class.hidden]="showConfirmation">
  <div class="form-group">
    <label for="matricNumber" class="form-label">Matric Number</label>
    <div class="matric-input-wrapper">
      <span class="matric-prefix">DLA/TE/26/</span>
      <input
        type="text"
        id="matricNumber"
        name="matricNumber"
        class="matric-input"
        maxlength="4"
        inputmode="numeric"
        pattern="[0-9]{4}"
        placeholder="XXXX"
        required
        autocomplete="off"
        [value]="matricNumber"
        (input)="onMatricInput($event)"
      />
    </div>
    <span class="form-hint">Enter only your last 4 digits</span>
  </div>

  <fieldset class="participants-fieldset">
    <legend class="form-label">Select Your Candidate</legend>
    <div class="participants-grid">
      @for (participant of votingService.participants; track participant.id) {
        <label class="participant-card" [class.selected]="selectedParticipant === participant.id">
          <input
            type="radio"
            name="participant"
            [value]="participant.id"
            [checked]="selectedParticipant === participant.id"
            (change)="selectedParticipant = participant.id"
            required
          />
          <div class="participant-card-inner">
            <div class="participant-identity">
              <span class="participant-avatar">{{ participant.avatar }}</span>
              <span class="participant-name">{{ participant.name }}</span>
            </div>
            <span class="participant-tag">Candidate</span>
          </div>
        </label>
      }
    </div>
  </fieldset>

  @if (errorMessage) {
    <span class="form-error">{{ errorMessage }}</span>
  }

  <button type="button" class="submit-btn" (click)="onSubmit()">
    <span class="btn-text">Submit Vote</span>
    <span class="btn-icon">&#8594;</span>
  </button>
</div>
